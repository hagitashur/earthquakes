name: fetch-quakes

# הפעלה ידנית בלבד: לשונית Actions -> fetch-quakes -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch earthquakes (last 30 days, magnitude 4.0+)
        run: python scripts/fetch_quakes.py
      - name: Commit data (also on failure, so the error log is visible in the repo)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update earthquake data"
          git push

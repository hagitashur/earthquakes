<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רעידות אדמה – החודש האחרון</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f1e4d3; --card:#f8efe3; --ink:#3a2a1d; --muted:#6b5645; --line:#d9c5ac; --accent:#8a4b1f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI",Arial,sans-serif; line-height:1.5; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { margin:0 0 4px; font-size:1.9rem; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card .label { color:var(--muted); font-size:.9rem; }
  .card .value { font-size:1.9rem; font-weight:700; color:var(--accent); }
  .card .note { font-size:.85rem; color:var(--muted); }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:20px; }
  h2 { margin:0 0 12px; font-size:1.2rem; }
  #map { height:420px; border-radius:8px; border:1px solid var(--line); }
  .chart-wrap { position:relative; height:280px; }
  .table-wrap { max-height:420px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; font-size:.95rem; }
  th, td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--line); }
  th { position:sticky; top:0; background:#e9d6bd; }
  #error { display:none; background:#f3d9c9; border:1px solid #c98e6a; padding:12px; border-radius:8px; margin-bottom:16px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:.85rem; color:var(--muted); }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-left:5px; vertical-align:middle; }
</style>
</head>
<body>
<main>
  <h1>רעידות אדמה בעולם – החודש האחרון</h1>
  <p class="sub" id="range">טוען נתונים…</p>
  <div id="error"></div>

  <div class="cards">
    <div class="card"><div class="label">רעידות בעוצמה 4 ומעלה</div><div class="value" id="total">–</div>
      <div class="note">עוצמה 4.0 בדיוק נספרת כאן</div></div>
    <div class="card"><div class="label">העוצמה החזקה ביותר</div><div class="value" id="maxmag">–</div>
      <div class="note"><bdi dir="ltr" id="maxplace"></bdi> · <span id="maxdate"></span></div></div>
    <div class="card"><div class="label">רעידות בעוצמה 5 ומעלה</div><div class="value" id="five">–</div></div>
  </div>

  <section>
    <h2>כמה רעידות בכל טווח עוצמה</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </section>

  <section>
    <h2>מפה</h2>
    <div id="map"></div>
    <div class="legend">
      <span><span class="dot" style="background:#e0a458"></span><bdi dir="ltr">4.0–4.9</bdi></span>
      <span><span class="dot" style="background:#d9742b"></span><bdi dir="ltr">5.0–5.9</bdi></span>
      <span><span class="dot" style="background:#b3321f"></span><bdi dir="ltr">6.0–6.9</bdi></span>
      <span><span class="dot" style="background:#5b0f0f"></span>7.0 ומעלה</span>
    </div>
  </section>

  <section>
    <h2>כל הרעידות (מהחדשה לישנה)</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>תאריך ושעה (שעון ישראל)</th><th>עוצמה</th><th>מדינה</th><th>מיקום</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/quakes.js"></script>
<script>
(function () {
  var fmt = new Intl.DateTimeFormat("he-IL", { timeZone: "Asia/Jerusalem", dateStyle: "short", timeStyle: "short" });
  var dayFmt = new Intl.DateTimeFormat("he-IL", { timeZone: "Asia/Jerusalem", dateStyle: "long" });
  function color(m) { return m >= 7 ? "#5b0f0f" : m >= 6 ? "#b3321f" : m >= 5 ? "#d9742b" : "#e0a458"; }
  function fail(msg) { var e = document.getElementById("error"); e.textContent = msg; e.style.display = "block"; }

  var d = window.QUAKES_DATA;
  if (!d) { fail("לא נמצאו נתונים. יש להפעיל את תהליך שליפת הנתונים (Actions → fetch-quakes) ולרענן."); document.getElementById("range").textContent = ""; return; }

  var s = d.summary, ev = d.events;
  document.getElementById("range").textContent =
    "מ-" + dayFmt.format(new Date(d.meta.range_start_utc)) + " עד " + dayFmt.format(new Date(d.meta.range_end_utc));
  document.getElementById("total").textContent = s.total_4_and_above.toLocaleString("he-IL");
  if (s.strongest) {
    document.getElementById("maxmag").textContent = s.strongest.mag.toFixed(1);
    document.getElementById("maxplace").textContent = s.strongest.place;
    document.getElementById("maxdate").textContent = dayFmt.format(new Date(s.strongest.time));
  }
  document.getElementById("five").textContent = (s.buckets["5.0-5.9"] + s.buckets["6.0-6.9"] + s.buckets["7.0 ומעלה"]).toLocaleString("he-IL");

  var labels = Object.keys(s.buckets);
  new Chart(document.getElementById("chart"), {
    type: "bar",
    data: { labels: labels, datasets: [{ data: labels.map(function (k) { return s.buckets[k]; }),
      backgroundColor: ["#e0a458", "#d9742b", "#b3321f", "#5b0f0f"] }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { color: "#3a2a1d" } }, x: { ticks: { color: "#3a2a1d" } } } }
  });

  var map = L.map("map", { worldCopyJump: true }).setView([20, 10], 2);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 7, attribution: "© OpenStreetMap" }).addTo(map);
  ev.forEach(function (e) {
    var m = L.circleMarker([e.lat, e.lon], { radius: 3 + (e.mag - 4) * 2.2, color: color(e.mag), fillColor: color(e.mag), fillOpacity: .65, weight: 1 }).addTo(map);
    var pop = document.createElement("div");
    pop.appendChild(document.createTextNode("עוצמה " + e.mag.toFixed(1) + " · "));
    var pl = document.createElement("bdi"); pl.dir = "ltr"; pl.textContent = e.place; pop.appendChild(pl);
    pop.appendChild(document.createTextNode(" · " + fmt.format(new Date(e.time))));
    m.bindPopup(pop);
  });

  var tbody = document.getElementById("rows");
  ev.forEach(function (e) {
    var tr = document.createElement("tr");
    [fmt.format(new Date(e.time)), e.mag.toFixed(1), e.country, e.place].forEach(function (t, i) {
      var td = document.createElement("td");
      if (i === 3) { var b = document.createElement("bdi"); b.dir = "ltr"; b.textContent = t; td.appendChild(b); }
      else td.textContent = t;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
})();
</script>
</body>
</html>
